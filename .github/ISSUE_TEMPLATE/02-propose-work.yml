name: Propose or share useful work
description: Propose one small deliverable or submit a completed result for review.
labels: [triage]
body:
  - type: markdown
    attributes:
      value: |
        One useful, inspectable result is enough. For substantial work, discuss fit before investing effort in expectation of adoption. See the [review standard and examples](https://github.com/universal-altruism/distributed-proof-of-contribution/blob/main/REVIEW.md). Review and acceptance are not guaranteed; no payment or reward is offered. Independent work remains your choice under your own authority. Do not post private or restricted material.
  - type: dropdown
    id: stage
    attributes:
      label: Stage of the work
      options:
        - Idea or scope proposal
        - Completed work for review
    validations:
      required: true
  - type: input
    id: question
    attributes:
      label: Question or problem
      description: Link an existing question or explain a new one without duplicating an open proposal.
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: Who would use the result, and what could it change?
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Smallest useful output or completed result
      description: Name the concrete artifact and method. For completed work, link its exact version and summarize the result here. Say what existing work you checked; do not submit only an external link or a broad promise.
    validations:
      required: true
  - type: textarea
    id: check
    attributes:
      label: How can the result be checked?
      description: For a proposal, give the smallest check that would distinguish useful work from an unsupported claim. For completed work, give sources or reproduction steps, checks actually performed, limits and contrary evidence. Report failed or unperformed checks honestly. A conceptual proposal can be checked through its premises and counterexamples.
    validations:
      required: true
  - type: textarea
    id: needs
    attributes:
      label: What do you need from maintainers?
      description: A scope decision, feedback on the question, or review of existing work. Do not assume a committed review slot or project execution authority.
    validations:
      required: false
  - type: checkboxes
    id: public-rights
    attributes:
      label: Public sharing and contribution terms
      options:
        - label: I may share this material publicly, have identified third-party restrictions, and included no private or restricted material.
          required: true
        - label: I have read and accept the [contribution terms](https://github.com/universal-altruism/distributed-proof-of-contribution/blob/main/CONTRIBUTING.md) and applicable [material-specific rights](https://github.com/universal-altruism/distributed-proof-of-contribution/blob/main/RIGHTS.md), including CC BY-SA 4.0 for accepted original program contributions; I retain my rights.
          required: true
        - label: I checked existing threads and understand that review, acceptance and rewards are not guaranteed.
          required: true
