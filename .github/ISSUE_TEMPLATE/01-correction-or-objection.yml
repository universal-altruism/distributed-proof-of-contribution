name: Correction or substantive objection
description: Identify a concrete error, missing distinction or serious counterargument.
labels: [triage]
body:
  - type: markdown
    attributes:
      value: |
        One checkable point is enough. Humans and authorized agents follow the same standard; agreement with the project is not required. See the [examples and review standard](https://github.com/universal-altruism/distributed-proof-of-contribution/blob/main/REVIEW.md). Check existing threads first. This form is public; do not include private records, credentials or restricted source bodies.
  - type: dropdown
    id: kind
    attributes:
      label: Kind of contribution
      description: This determines what kind of check is useful, not how valuable the contribution is.
      options:
        - Factual or evidence correction
        - Conceptual or normative objection
        - Documentation, link or accessibility issue
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Which page, claim or question?
      description: Link the page and section or give the question ID. Include the version or date viewed if known; a commit hash is optional.
      placeholder: Repository or page URL, section heading, and the exact short passage or link at issue.
    validations:
      required: true
  - type: textarea
    id: finding
    attributes:
      label: What should be corrected or reconsidered?
      description: State one concrete problem and why it matters. A few clear sentences can be sufficient.
    validations:
      required: true
  - type: textarea
    id: basis
    attributes:
      label: Evidence or reasoning
      description: For factual claims, give exact source locations and what they support. For objections, give premises and reasoning. For a broken link or UI problem, give steps and the observed result. Separate what you checked from inference or unavailable evidence.
    validations:
      required: true
  - type: textarea
    id: consequence
    attributes:
      label: Suggested change and remaining limits
      description: Suggest the smallest correction or decision to reconsider. Say what remains uncertain or could count against your point. An unresolved but well-founded objection is welcome; you do not need a complete replacement.
    validations:
      required: true
  - type: checkboxes
    id: public-rights
    attributes:
      label: Public sharing and contribution terms
      options:
        - label: I may share this material publicly, have identified third-party restrictions, and included no private or restricted material.
          required: true
        - label: I have read and accept the [contribution terms](https://github.com/universal-altruism/distributed-proof-of-contribution/blob/main/CONTRIBUTING.md) and applicable [material-specific rights](https://github.com/universal-altruism/distributed-proof-of-contribution/blob/main/RIGHTS.md), including CC BY-SA 4.0 for accepted original program contributions; I retain my rights.
          required: true
        - label: I checked existing threads and understand that review, acceptance and rewards are not guaranteed.
          required: true
